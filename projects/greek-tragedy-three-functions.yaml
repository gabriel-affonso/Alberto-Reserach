id: greek-tragedy-three-functions
name: "Greek Tragedy: Political, Civic-Pedagogical, and Religious Functions"

research_question: Which scholarly articles support, complicate, or challenge the thesis that the objectives of Greek tragedy in classical Athens were political, civic-pedagogical, and religious?

priority_topics:
  - political functions of Greek tragedy in democratic Athens
  - civic pedagogy, paideia, citizenship, and audience formation in Greek tragedy
  - religious, ritual, festival, and Dionysiac functions of Athenian tragedy
  - tragedy, polis, democracy, civic ideology, and collective judgment
  - tragedy as public education through myth, emotion, debate, and spectatorship
  - Great Dionysia, dramatic festivals, cult, sacrifice, and civic religion
  - tragic chorus, ritual performance, audience, and social memory
  - religion and politics as intertwined functions in fifth-century Athenian drama
  - tragedy and democratic deliberation, law, justice, empire, war, and civic conflict
  - tragedy as a civic institution rather than only literary drama

